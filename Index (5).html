function lsGet(k, def) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function round2(n) { const x = Number(n); return isFinite(x) ? Math.round(x * 100) / 100 : 0; }
function hasServer() { return typeof google !== 'undefined' && google.script && google.script.run; }
// Frontend tidak menyimpan Spreadsheet ID. Semua permintaan data diarahkan ke
// backend Apps Script, yang memakai satu database melalui getDatabase_().
function gasRun(fn, args, onOk, onFail) {
  if (!hasServer()) {
    if (onFail) onFail({ message: 'Aplikasi tidak terhubung ke layanan Google Apps Script.' });
    return false;
  }
  let r = google.script.run;
  r = r.withSuccessHandler(onOk || function () {});
  r = r.withFailureHandler(function (err) {
    const message = err && err.message ? err.message : 'Terjadi kesalahan saat menghubungi server SI-AMI.';
    if (onFail) onFail({ message: message, originalError: err });
  });
  r[fn].apply(r, args || []);
  return true;
}
/**
 * ATURAN BAKU KELAYAKAN AKTIVASI INSTRUMEN
 * BLOKIR jika: tidak ada kriteria | tidak ada indikator | rentang skor tidak valid
 *        | bobot negatif | bobot > 100% | total bobot != 100%
 */
function validateInstrument(instrumentId, criteriaList, indicatorList) {
 const errors = [], warnings = [];
 const crit = (criteriaList || []).filter(c => c.instrumentId === instrumentId);
 const inds = (indicatorList || []).filter(i => i.instrumentId === instrumentId);
    if (!instrumentId) errors.push('Instrumen belum dipilih.');
    if (crit.length === 0) errors.push('Belum ada kriteria pada instrumen ini (Langkah 2).');
    if (inds.length === 0) errors.push('Belum ada indikator pertanyaan pada instrumen ini (Langkah 3).');
    crit.forEach(c => {
     const n = inds.filter(i => i.kriteriaId === c.kriteriaId).length;
     if (n === 0) errors.push(`Kriteria ${c.kodeKriteria} — ${c.namaKriteria} belum memiliki indikator pertanyaan.`);
    });
    inds.forEach(d => {
     const kode = d.kodeIndikator || d.indikatorId;
     const min = Number(d.skorMin), max = Number(d.skorMax);
     const bob = Number(d.bobot), tgt = Number(d.targetSkor);
     if (!String(d.pertanyaan || '').trim())
       errors.push(`Indikator ${kode}: pertanyaan / standar mutu masih kosong.`);
     if (!isFinite(min) || !isFinite(max)) {
       errors.push(`Indikator ${kode}: rentang skor tidak valid (bukan angka).`);
     } else {
       if (min < 0) errors.push(`Indikator ${kode}: skor minimum negatif (${min}).`);
       if (max <= min) errors.push(`Indikator ${kode}: rentang skor tidak valid (${min}–${max}); skor maksimum harus lebih besar dari minimum.`);
     }
     if (!isFinite(bob)) {
       errors.push(`Indikator ${kode}: bobot tidak valid.`);
     } else {
       if (bob < 0) errors.push(`Indikator ${kode}: bobot negatif (${bob}%) tidak diperbolehkan.`);
       if (bob > 100) errors.push(`Indikator ${kode}: bobot ${bob}% melebihi 100%.`);
       if (bob === 0) warnings.push(`Indikator ${kode}: bobot masih 0%.`);
     }
     if (isFinite(tgt) && isFinite(min) && isFinite(max) && (tgt < min || tgt > max))
       warnings.push(`Indikator ${kode}: target skor ${tgt} di luar rentang ${min}–${max}.`);
    });
    const totalBobot = round2(inds.reduce((s, d) => s + (Number(d.bobot) || 0), 0));
    if (inds.length > 0 && Math.abs(totalBobot - 100) > 0.01)
      errors.push(`Total bobot seluruh indikator = ${totalBobot}% (wajib tepat 100%). Selisih ${round2(100 - totalBobot)}%.`);
    return { valid: errors.length === 0, errors, warnings, totalBobot,
         jumlahKriteria: crit.length, jumlahIndikator: inds.length };
}

           {result.totalBobot}%

        {result.warnings.map((w, i) => <li key={i}>⚠ {w}</li>)}
       </ul>
     )}
    </div>
  );
}

function InstrumentPage({ currentUser }) {
  const isSuperAdmin = currentUser?.role === ROLES.SUPER_ADMIN;
const [loading, setLoading]         = useState(true);
const [toast, setToast]          = useState({ show: false, message: '', type: 'success' });
const [instruments, setInstruments] = useState([]);
const [criteria, setCriteria]     = useState([]);
const [indicators, setIndicators] = useState([]);
const [selectedId, setSelectedId] = useState('');
const [step, setStep]            = useState(1);
const [search, setSearch]          = useState('');
const [critFilter, setCritFilter] = useState('ALL');
const [instModal, setInstModal] = useState(null);
const [critModal, setCritModal] = useState(null);
const [indModal, setIndModal] = useState(null);
const [confirm, setConfirm] = useState(null);
const notify = (message, type = 'success') => {
 setToast({ show: true, message, type });
 setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 4500);
};
/* -------------------------- LOAD DATA -------------------------- */
const applyBundle = (b) => {
 const ins = Array.isArray(b.instruments) ? b.instruments : [];
 const cr = Array.isArray(b.criteria) ? b.criteria : [];
 const ind = Array.isArray(b.indicators) ? b.indicators : [];
 setInstruments(ins); setCriteria(cr); setIndicators(ind);
 lsSet(LS_KEYS.INST, ins); lsSet(LS_KEYS.CRIT, cr); lsSet(LS_KEYS.IND, ind);
 setSelectedId(prev => (prev && ins.some(i => i.instrumentId === prev))
   ? prev : (ins[0] ? ins[0].instrumentId : ''));
};
const loadLocal = () => applyBundle({
 instruments: lsGet(LS_KEYS.INST, []),
 criteria : lsGet(LS_KEYS.CRIT, []),
 indicators : lsGet(LS_KEYS.IND, [])
});
const refreshInstrumentBundle = (done) => {
 const ok = gasRun('getInstrumentBundle', [], (res) => {
   if (res && res.success && res.data) { applyBundle(res.data); if (done) done(true); }
   else { if (done) done(false, res?.error || 'Server tidak mengembalikan data instrumen.'); }
 }, (err) => { if (done) done(false, err?.message || 'Gagal membaca data dari server.'); });
 if (!ok && done) done(false, 'Koneksi Google Apps Script tidak tersedia.');
};
useEffect(() => {
 setLoading(true);
 const ok = gasRun('getInstrumentBundle', [],
   (res) => { (res && res.success && res.data) ? applyBundle(res.data) : loadLocal(); setLoading(false); },
   () => { loadLocal(); setLoading(false); });
 if (!ok) { loadLocal(); setLoading(false); }
}, []);
useEffect(() => { if (window.lucide) window.lucide.createIcons(); },
 [step, instruments, criteria, indicators, selectedId, instModal, critModal, indModal, confirm, toast, loading]);
/* --------------------------- DERIVED --------------------------- */
const currentInstrument = instruments.find(i => i.instrumentId === selectedId) || null;
const critOfInst = useMemo(() =>
 criteria.filter(c => c.instrumentId === selectedId)
       .sort((a, b) => (a.urutan || 0) - (b.urutan || 0)),
 [criteria, selectedId]);
const indOfInst = useMemo(() =>
 indicators.filter(i => i.instrumentId === selectedId)
         .sort((a, b) => (a.urutan || 0) - (b.urutan || 0)),
 [indicators, selectedId]);
const validation = useMemo(() => validateInstrument(selectedId, criteria, indicators),
 [selectedId, criteria, indicators]);
const critName = (id) => {
 const c = criteria.find(x => x.kriteriaId === id);
 return c ? `${c.kodeKriteria} — ${c.namaKriteria}` : '(kriteria terhapus)';
};
const viewIndicators = indOfInst.filter(d => {
 const okCrit = critFilter === 'ALL' || d.kriteriaId === critFilter;
 const q = search.toLowerCase();
 const okSearch = !q || String(d.kodeIndikator || '').toLowerCase().includes(q)
             || String(d.pertanyaan || '').toLowerCase().includes(q);
 return okCrit && okSearch;
});
const guard = () => { if (!isSuperAdmin) { notify('Hanya Super Admin yang dapat mengubah instrumen.', 'error'); return false; } return true; };
/* ------------------ LANGKAH 1 : MASTER INSTRUMEN ---------------- */
const saveInstrument = (form) => {
 if (!guard()) return;
 const nama = String(form.namaInstrumen || '').trim();
 if (!nama) return notify('Nama instrumen wajib diisi!', 'error');
 if (instruments.some(i => i.instrumentId !== form.instrumentId &&
    String(i.namaInstrumen || '').trim().toLowerCase() === nama.toLowerCase()))
   return notify('Nama instrumen sudah digunakan.', 'error');
 const isNew = !form.instrumentId;
 const obj = {
   instrumentId : form.instrumentId || uid('INS'),
   namaInstrumen: nama,
   deskripsi : String(form.deskripsi || ''),
   status : form.status || 'DRAFT',
   createdBy : form.createdBy || currentUser?.nama || '',
   createdAt : form.createdAt || new Date().toISOString(),
   updatedAt : new Date().toISOString()
 };
 gasRun('saveInstrumentMasterServer', [obj, currentUser?.role, currentUser?.userId], (r) => {
   if (!r || !r.success) { notify(r?.message || 'Instrumen gagal disimpan ke server.', 'error'); refreshInstrumentBundle(); return; }
   refreshInstrumentBundle((ok, err) => {
     if (!ok) { notify('Instrumen tersimpan, tetapi daftar gagal dimuat ulang: ' + err, 'error'); return; }
     setSelectedId(obj.instrumentId); setInstModal(null);
     notify(isNew ? 'Instrumen berhasil tersimpan di server. Lanjut membuat KRITERIA.' : 'Instrumen berhasil diperbarui.');
     if (isNew) setStep(2);
   });
 }, (err) => { notify('Gagal menyimpan instrumen: ' + (err?.message || 'Kesalahan server.'), 'error'); refreshInstrumentBundle(); });
};

const removeInstrument = (inst) => {
 if (!guard()) return;
 const nextI = instruments.filter(i => i.instrumentId !== inst.instrumentId);
 const nextC = criteria.filter(c => c.instrumentId !== inst.instrumentId);
 const nextD = indicators.filter(d => d.instrumentId !== inst.instrumentId);
 setInstruments(nextI); setCriteria(nextC); setIndicators(nextD);
 lsSet(LS_KEYS.INST, nextI); lsSet(LS_KEYS.CRIT, nextC); lsSet(LS_KEYS.IND, nextD);
 if (selectedId === inst.instrumentId) setSelectedId(nextI[0] ? nextI[0].instrumentId : '');
 gasRun('deleteInstrumentMasterServer', [inst.instrumentId, currentUser?.role],
   (r) => { if (r && !r.success) notify(r.message, 'error'); });
 setConfirm(null);
  notify('Instrumen dihapus beserta kriteria & indikatornya.');
};
/* ---------------------- LANGKAH 2 : KRITERIA -------------------- */
const saveCriteria = (form) => {
 if (!guard()) return;
 if (!selectedId) return notify('Buat / pilih instrumen terlebih dahulu (Langkah 1).', 'error');
 const kode = String(form.kodeKriteria || '').trim().toUpperCase();
 const nama = String(form.namaKriteria || '').trim();
 if (!kode || !nama) return notify('Kode dan Nama Kriteria wajib diisi!', 'error');
 if (critOfInst.some(c => c.kriteriaId !== form.kriteriaId && String(c.kodeKriteria || '').toUpperCase() === kode))
   return notify(`Kode kriteria "${kode}" sudah ada pada instrumen ini.`, 'error');
 const obj = {
   kriteriaId : form.kriteriaId || uid('KRI'), instrumentId: selectedId,
   kodeKriteria: kode, namaKriteria: nama,
   urutan : form.urutan || (critOfInst.length + 1),
   createdAt : form.createdAt || new Date().toISOString()
 };
 gasRun('saveCriteriaServer', [obj, currentUser?.role, currentUser?.userId], (r) => {
   if (!r || !r.success) { notify(r?.message || 'Kriteria gagal disimpan ke server.', 'error'); refreshInstrumentBundle(); return; }
   refreshInstrumentBundle((ok, err) => {
     if (!ok) { notify('Kriteria tersimpan, tetapi daftar gagal dimuat ulang: ' + err, 'error'); return; }
     setCritModal(null); notify('Kriteria berhasil disimpan ke server.');
   });
 }, (err) => { notify('Gagal menyimpan kriteria: ' + (err?.message || 'Kesalahan server.'), 'error'); refreshInstrumentBundle(); });
};

const removeCriteria = (c) => {
 if (!guard()) return;
 const nextC = criteria.filter(x => x.kriteriaId !== c.kriteriaId);
 const nextD = indicators.filter(x => x.kriteriaId !== c.kriteriaId);
 setCriteria(nextC); setIndicators(nextD);
 lsSet(LS_KEYS.CRIT, nextC); lsSet(LS_KEYS.IND, nextD);
 gasRun('deleteCriteriaServer', [c.kriteriaId, currentUser?.role]);
 setConfirm(null);
  notify('Kriteria & indikator di bawahnya dihapus.');
};
/* ------- LANGKAH 3/4/5 : INDIKATOR, RENTANG SKOR, BOBOT --------- */
const openIndikator = (item) => {
 if (!guard()) return;
 if (!selectedId)       return notify('Buat / pilih instrumen dahulu (Langkah 1).', 'error');
 if (critOfInst.length === 0) return notify('Buat minimal 1 kriteria dahulu (Langkah 2).', 'error');
 if (item) { setIndModal({ ...item }); return; }
 const c = critOfInst[0];
 const n = indicators.filter(d => d.kriteriaId === c.kriteriaId).length + 1;
 setIndModal({
   indikatorId: '', instrumentId: selectedId, kriteriaId: c.kriteriaId,
   kodeIndikator: `IND-${c.kodeKriteria}-${String(n).padStart(2, '0')}`,
    pertanyaan: '', skorMin: 0, skorMax: 4, bobot: 0, targetSkor: 3,
    urutan: indOfInst.length + 1
  });
};
const saveIndikator = (form) => {
 if (!guard()) return;
 const kode = String(form.kodeIndikator || '').trim().toUpperCase();
 if (!kode) return notify('Kode indikator wajib diisi!', 'error');
 if (!String(form.pertanyaan || '').trim()) return notify('Pertanyaan / standar mutu wajib diisi!', 'error');
 if (!form.kriteriaId) return notify('Kriteria induk wajib dipilih!', 'error');
 const min = Number(form.skorMin), max = Number(form.skorMax), bob = Number(form.bobot);
 if (!isFinite(min) || !isFinite(max)) return notify('Rentang skor harus berupa angka.', 'error');
 if (min < 0) return notify('Skor minimum tidak boleh negatif.', 'error');
 if (max <= min) return notify('Rentang skor tidak valid: skor maksimum harus lebih besar dari skor minimum.', 'error');
 if (!isFinite(bob)) return notify('Bobot harus berupa angka.', 'error');
 if (bob < 0 || bob > 100) return notify('Bobot harus berada pada rentang 0–100%.', 'error');
 if (indOfInst.some(d => d.indikatorId !== form.indikatorId && String(d.kodeIndikator || '').toUpperCase() === kode))
   return notify(`Kode indikator "${kode}" sudah dipakai pada instrumen ini.`, 'error');
 const isNew = !form.indikatorId;
 const obj = {
   indikatorId : form.indikatorId || uid('IND'), instrumentId: selectedId,
   kriteriaId : form.kriteriaId, kodeIndikator: kode,
   pertanyaan : String(form.pertanyaan).trim(),
   skorMin : round2(min), skorMax: round2(max), bobot: round2(bob),
   targetSkor: round2(form.targetSkor), urutan: form.urutan || (indOfInst.length + 1),
   createdAt: form.createdAt || new Date().toISOString()
 };
 gasRun('saveIndicatorServer', [obj, currentUser?.role, currentUser?.userId], (r) => {
   if (!r || !r.success) { notify(r?.message || 'Indikator gagal disimpan ke server.', 'error'); refreshInstrumentBundle(); return; }
   refreshInstrumentBundle((ok, err) => {
     if (!ok) { notify('Indikator tersimpan, tetapi daftar gagal dimuat ulang: ' + err, 'error'); return; }
     setIndModal(null); notify(isNew ? 'Indikator berhasil disimpan. Lanjut atur rentang skor dan bobot.' : 'Indikator berhasil diperbarui.');
   });
 }, (err) => { notify('Gagal menyimpan indikator: ' + (err?.message || 'Kesalahan server.'), 'error'); refreshInstrumentBundle(); });
};

const removeIndikator = (d) => {
 if (!guard()) return;
 const next = indicators.filter(x => x.indikatorId !== d.indikatorId);
 setIndicators(next); lsSet(LS_KEYS.IND, next);
 gasRun('deleteIndicatorServer', [d.indikatorId, currentUser?.role]);
 setConfirm(null);
  notify(`Indikator ${d.kodeIndikator} dihapus.`);
};
/* Edit cepat (inline) untuk Langkah 4 & 5 */
const patchIndikator = (id, patch) => {
 if (!guard()) return;
 const next = indicators.map(d => d.indikatorId === id ? { ...d, ...patch } : d);
 setIndicators(next); lsSet(LS_KEYS.IND, next);
};
const commitIndikator = (id) => {
 const d = indicators.find(x => x.indikatorId === id);
 if (!d) return;
 gasRun('saveIndicatorServer', [d, currentUser?.role, currentUser?.userId], (r) => {
   if (!r || !r.success) notify(r?.message || 'Perubahan rentang skor/bobot gagal disimpan.', 'error');
   else refreshInstrumentBundle();
 }, (err) => notify('Gagal menyimpan perubahan: ' + (err?.message || 'Kesalahan server.'), 'error'));
};
const bagiRataBobot = () => {
 if (!guard()) return;
 const n = indOfInst.length;
 if (!n) return notify('Belum ada indikator.', 'error');
 const base = Math.floor((100 / n) * 100) / 100;
 const sisa = round2(100 - base * n);
 const lastId = indOfInst[n - 1].indikatorId;
 const next = indicators.map(d => d.instrumentId !== selectedId ? d
   : { ...d, bobot: d.indikatorId === lastId ? round2(base + sisa) : base });
 setIndicators(next); lsSet(LS_KEYS.IND, next);
 gasRun('saveIndicatorsBatchServer',
   [next.filter(d => d.instrumentId === selectedId), currentUser?.role], (r) => {
     if (!r || !r.success) { notify(r?.message || 'Bobot gagal disimpan.', 'error'); refreshInstrumentBundle(); }
     else refreshInstrumentBundle(() => notify('Bobot berhasil disimpan — total tepat 100%.'));
   }, (err) => { notify('Gagal menyimpan bobot: ' + (err?.message || 'Kesalahan server.'), 'error'); refreshInstrumentBundle(); });
};
/* ----------------------- AKTIVASI INSTRUMEN --------------------- */
const setStatus = (status) => {
 if (!guard()) return;
 if (status === 'AKTIF' && !validation.valid) {
   notify('Aktivasi ditolak: ' + validation.errors.join(' | '), 'error'); return;
 }
 gasRun('setInstrumentStatusServer', [selectedId, status, currentUser?.role, currentUser?.userId], (r) => {
   if (!r || !r.success) { notify(r?.message || 'Status instrumen gagal diperbarui.', 'error'); refreshInstrumentBundle(); return; }
   refreshInstrumentBundle(() => notify(r.message || (status === 'AKTIF' ? 'Instrumen berhasil diaktivasi.' : 'Status instrumen diperbarui.')));
 }, (err) => { notify('Gagal memperbarui status instrumen: ' + (err?.message || 'Kesalahan server.'), 'error'); refreshInstrumentBundle(); });
};

/* ----------------------------- STEPS ---------------------------- */
const steps = [
  { n: 1, label: 'Nama Instrumen', done: !!currentInstrument },
  { n: 2, label: 'Kriteria',      done: critOfInst.length > 0 },
  { n: 3, label: 'Indikator',       done: indOfInst.length > 0 },
  { n: 4, label: 'Rentang Skor', done: indOfInst.length > 0 &&
         indOfInst.every(d => Number(d.skorMin) >= 0 && Number(d.skorMax) > Number(d.skorMin)) },
  { n: 5, label: 'Bobot',          done: indOfInst.length > 0 &&
         indOfInst.every(d => Number(d.bobot) >= 0 && Number(d.bobot) <= 100) &&
         Math.abs(validation.totalBobot - 100) <= 0.01 }
];
const canGo = (n) => {
  if (n === 1) return true;
  if (n === 2) return !!currentInstrument;
  return !!currentInstrument && critOfInst.length > 0;
};
const goStep = (n) => {
  if (!canGo(n)) return notify('Selesaikan langkah sebelumnya terlebih dahulu.', 'error');
  setStep(n);
};
const statusBadge = (s) => s === 'AKTIF' ? 'status-completed'
            : s === 'NONAKTIF' ? 'status-closed' : 'status-draft';
/* ----------------------------- RENDER --------------------------- */
return (
 <div className="space-y-6">
  {toast.show && (
    <div className={`fixed top-4 right-4 z-[60] max-w-sm px-4 py-3 rounded-lg shadow-xl border flex items-start gap-3 text-xs font-semibold animate-fadeIn ${
     toast.type === 'error' ? 'bg-red-900/95 text-red-200 border-red-500'
                      : 'bg-emerald-900/95 text-emerald-200 border-emerald-500'}`}>
     <i data-lucide={toast.type === 'error' ? 'alert-octagon' : 'check-circle-2'} className="w-4 h-4 mt-0.5"></i>
     <span className="whitespace-pre-line">{toast.message}</span>
    </div>
  )}
  {/* HEADER */}
  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-white/10">
   <div>

      <h1 className="text-xl font-bold text-white">Instrument Builder SPMI</h1>
      <span className={`status-badge ${getRoleBadgeClass(currentUser?.role)} text-[10px]`}>
       Akses {currentUser?.role || '-'}
      </span>
     </div>
     <p className="text-xs text-slate-400 mt-1">
      Alur baku: 1. Nama Instrumen → 2. Kriteria → 3. Indikator Pertanyaan → 4. Rentang Skor → 5. Bobot → Aktivasi.
     </p>
   </div>
   {isSuperAdmin && (
     <button onClick={() => setInstModal({ instrumentId: '', namaInstrumen: '', deskripsi: '', status: 'DRAFT' })}
          className="siami-btn-primary px-4 py-2 rounded-lg text-xs flex items-center gap-1.5 self-start md:self-auto">
    <i data-lucide="file-plus" className="w-4 h-4"></i> Buat Instrumen Baru
  </button>
 )}
</div>
{!isSuperAdmin && (
 <div className="p-3 rounded-lg bg-amber-500/10 border border-amber-500/25 text-[11px] text-amber-300 flex items-center gap-2">
   <i data-lucide="lock" className="w-4 h-4"></i>
   Mode baca-saja. Hanya <b className="mx-1">Super Admin</b> yang dapat membuat, mengubah, dan mengaktivasi instrumen audit.
 </div>
)}
{/* PEMILIH INSTRUMEN AKTIF */}
<div className="siami-card p-4 border-yellow-500/30 space-y-3">
 <label className="block text-slate-400 text-[11px] font-semibold uppercase tracking-wider">
  Instrumen yang sedang dikerjakan
 </label>
 <div className="flex flex-col lg:flex-row lg:items-center gap-3">
  <select value={selectedId}
         onChange={e => { setSelectedId(e.target.value); setCritFilter('ALL'); setStep(2); }}
         className="siami-input font-bold text-yellow-400 text-sm flex-1">
    {instruments.length === 0
      ? <option value="">-- Belum ada instrumen. Klik "Buat Instrumen Baru" --</option>
      : instruments.map(i => (
         <option key={i.instrumentId} value={i.instrumentId}>
          {i.namaInstrumen} [{i.status}]
         </option>))}
  </select>
  {currentInstrument && (
    <div className="flex items-center gap-2">
      <span className={`status-badge ${statusBadge(currentInstrument.status)}`}>{currentInstrument.status}</span>
      {isSuperAdmin && (
        <>
         <button onClick={() => setInstModal({ ...currentInstrument })}
              className="p-2 rounded text-yellow-400 hover:bg-yellow-500/10 border border-white/10" title="Ubah nama instrumen">
          <i data-lucide="edit-3" className="w-4 h-4"></i>
         </button>
         <button onClick={() => setConfirm({
               title: 'Hapus Instrumen',
               message: `Hapus "${currentInstrument.namaInstrumen}" beserta seluruh kriteria & indikatornya?`,
               onYes: () => removeInstrument(currentInstrument) })}
              className="p-2 rounded text-red-400 hover:bg-red-500/10 border border-white/10" title="Hapus instrumen">
          <i data-lucide="trash-2" className="w-4 h-4"></i>
         </button>
        </>
      )}
    </div>
  )}
 </div>
</div>
{/* STEPPER */}
<div className="siami-card p-3 flex flex-wrap gap-2">
 {steps.map(s => (
   <button key={s.n} onClick={() => goStep(s.n)} disabled={!canGo(s.n)}
    className={`flex items-center gap-2 px-3 py-2 rounded-lg text-[11px] font-semibold border transition-all ${
     step === s.n ? 'bg-yellow-500/20 text-yellow-300 border-yellow-500/40'
     : s.done ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/25'
              : 'bg-white/5 text-slate-400 border-white/10'} ${!canGo(s.n) ? 'opacity-40 cursor-not-allowed' : ''}`}>
    <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold ${
     s.done ? 'bg-emerald-500 text-black' : 'bg-white/10 text-slate-300'}`}>
     {s.done ? '✓' : s.n}
    </span>
    {s.label}
   </button>
 ))}
</div>
{/* ---------------- LANGKAH 1 ---------------- */}
{step === 1 && (
 <div className="siami-card overflow-hidden">
   <div className="p-4 border-b border-white/10">
    <h3 className="text-sm font-bold text-white">Langkah 1 — Daftar Master Instrumen</h3>
    <p className="text-[11px] text-slate-400 mt-0.5">Buat nama instrumen audit terlebih dahulu sebelum menyusun kriteria.</p>
   </div>
   <div className="overflow-x-auto">
    <table className="siami-table w-full">
     <thead><tr>
       <th>Nama Instrumen</th><th>Deskripsi</th>
       <th className="text-center">Kriteria</th><th className="text-center">Indikator</th>
       <th className="text-center">Total Bobot</th><th className="text-center">Status</th>
       {isSuperAdmin && <th className="text-right">Aksi</th>}
     </tr></thead>
     <tbody>
       {loading ? (
         <tr><td colSpan={isSuperAdmin ? 7 : 6} className="text-center py-8 text-slate-400">Memuat data instrumen...</td></tr>
       ) : instruments.length === 0 ? (
         <tr><td colSpan={isSuperAdmin ? 7 : 6} className="text-center py-8 text-slate-400">Belum ada instrumen. Klik “Buat Instrumen Baru”.</td></tr>
       ) : instruments.map(i => {
         const v = validateInstrument(i.instrumentId, criteria, indicators);
         return (
           <tr key={i.instrumentId} className={i.instrumentId === selectedId ? 'bg-yellow-500/5' : ''}>
            <td>
              <div className="font-semibold text-white">{i.namaInstrumen}</div>
              <div className="text-[10px] text-slate-500 font-mono">{i.instrumentId}</div>
            </td>
            <td className="text-[11px] text-slate-400 max-w-xs">{i.deskripsi || '-'}</td>
            <td className="text-center font-bold text-yellow-400">{v.jumlahKriteria}</td>
            <td className="text-center font-bold text-blue-400">{v.jumlahIndikator}</td>
            <td className={`text-center font-bold ${Math.abs(v.totalBobot - 100) <= 0.01 ? 'text-emerald-400' : 'text-red-400'}`}>{v.totalBobot}%</td>
            <td className="text-center"><span className={`status-badge ${statusBadge(i.status)}`}>{i.status}</span></td>
            {isSuperAdmin && (
              <td>
               <div className="flex items-center justify-end gap-2">
                <button onClick={() => { setSelectedId(i.instrumentId); setStep(2); }}
                      className="px-2 py-1 rounded text-[10px] font-bold bg-yellow-500/15 text-yellow-300 border border-yellow-500/30">Kelola</button>
                <button onClick={() => setInstModal({ ...i })} className="p-1.5 text-yellow-400 hover:bg-yellow-500/10 rounded">
                 <i data-lucide="edit-3" className="w-4 h-4"></i></button>
                <button onClick={() => setConfirm({ title: 'Hapus Instrumen',
                       message: `Hapus "${i.namaInstrumen}" beserta kriteria & indikatornya?`,
                       onYes: () => removeInstrument(i) })}
                      className="p-1.5 text-red-400 hover:bg-red-500/10 rounded">
                 <i data-lucide="trash-2" className="w-4 h-4"></i></button>
               </div>
              </td>
            )}
           </tr>);
       })}
     </tbody>
    </table>
   </div>
 </div>
)}
{/* ---------------- LANGKAH 2 ---------------- */}
{step === 2 && (
 <div className="siami-card overflow-hidden">
   <div className="p-4 border-b border-white/10 flex items-center justify-between gap-3">
    <div>
      <h3 className="text-sm font-bold text-white">Langkah 2 — Kriteria SPMI</h3>
      <p className="text-[11px] text-slate-400 mt-0.5">Instrumen: <b className="text-yellow-400">{currentInstrument?.namaInstrumen || '-'}</b></p>
    </div>
    {isSuperAdmin && (
      <button onClick={() => setCritModal({ kriteriaId: '', kodeKriteria: '', namaKriteria: '' })}
           className="px-3 py-2 rounded-lg bg-blue-500/20 text-blue-300 border border-blue-500/30 text-xs font-semibold flex items-center gap-1.5">
       <i data-lucide="folder-plus" className="w-4 h-4"></i> Tambah Kriteria
      </button>)}
   </div>
   <div className="overflow-x-auto">
    <table className="siami-table w-full">
      <thead><tr>
       <th style={{width:'110px'}}>Kode</th><th>Nama Kriteria</th>
      <th className="text-center">Jml Indikator</th><th className="text-center">Bobot Kriteria</th>
      {isSuperAdmin && <th className="text-right">Aksi</th>}
     </tr></thead>
     <tbody>
      {critOfInst.length === 0 ? (
        <tr><td colSpan={isSuperAdmin ? 5 : 4} className="text-center py-8 text-slate-400">Belum ada kriteria. Instrumen tidak dapat diaktivasi tanpa kriteria.</td></tr>
      ) : critOfInst.map(c => {
        const list = indOfInst.filter(d => d.kriteriaId === c.kriteriaId);
        const bob = round2(list.reduce((s, d) => s + Number(d.bobot || 0), 0));
        return (
          <tr key={c.kriteriaId}>
           <td className="font-mono text-xs text-yellow-400 font-bold">{c.kodeKriteria}</td>
           <td className="text-white font-semibold">{c.namaKriteria}</td>
           <td className={`text-center font-bold ${list.length ? 'text-blue-400' : 'text-red-400'}`}>{list.length}</td>
           <td className="text-center font-bold text-emerald-400">{bob}%</td>
           {isSuperAdmin && (
             <td><div className="flex items-center justify-end gap-2">
              <button onClick={() => setCritModal({ ...c })} className="p-1.5 text-yellow-400 hover:bg-yellow-500/10 rounded">
               <i data-lucide="edit-3" className="w-4 h-4"></i></button>
              <button onClick={() => setConfirm({ title: 'Hapus Kriteria',
                    message: `Hapus kriteria ${c.kodeKriteria} beserta ${list.length} indikatornya?`,
                    onYes: () => removeCriteria(c) })}
                   className="p-1.5 text-red-400 hover:bg-red-500/10 rounded">
               <i data-lucide="trash-2" className="w-4 h-4"></i></button>
             </div></td>)}
          </tr>);
      })}
     </tbody>
    </table>
   </div>
 </div>
)}
{/* ---------------- LANGKAH 3 ---------------- */}
{step === 3 && (
 <div className="space-y-4">
   <div className="siami-card p-4 grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
    <div>
      <label className="block text-slate-400 text-[10px] uppercase font-semibold mb-1">Filter Kriteria</label>
      <select value={critFilter} onChange={e => setCritFilter(e.target.value)} className="siami-input">
       <option value="ALL">Semua Kriteria</option>
       {critOfInst.map(c => <option key={c.kriteriaId} value={c.kriteriaId}>{c.kodeKriteria} — {c.namaKriteria}</option>)}
      </select>
    </div>
    <div>
      <label className="block text-slate-400 text-[10px] uppercase font-semibold mb-1">Cari Indikator</label>
      <input type="text" value={search} onChange={e => setSearch(e.target.value)}
           placeholder="Kode atau isi pertanyaan..." className="siami-input" />
    </div>
    {isSuperAdmin && (
      <button onClick={() => openIndikator(null)} className="siami-btn-primary px-3 py-2.5 rounded-lg text-xs flex items-center justify-center gap-1.5">
       <i data-lucide="plus-circle" className="w-4 h-4"></i> Tambah Indikator Pertanyaan
      </button>)}
   </div>
   <div className="siami-card overflow-hidden">
    <div className="overflow-x-auto">
     <table className="siami-table w-full">

/* =======================================================================
   KEGIATAN AUDIT (Super Admin)
   Nama kegiatan (teks) → Tahun periode (dropdown 2026–2046)
   → Pilih instrumen → AKTIVASI (dengan penjagaan validasi)
   ======================================================================= */
function KegiatanAuditPage({ currentUser }) {
  const isSuperAdmin = currentUser?.role === ROLES.SUPER_ADMIN;
const [loading, setLoading]        = useState(true);
const [toast, setToast]         = useState({ show: false, message: '', type: 'success' });
const [activities, setActivities] = useState([]);
const [instruments, setInstruments] = useState([]);
const [criteria, setCriteria]    = useState([]);
const [indicators, setIndicators] = useState([]);
const [confirm, setConfirm]         = useState(null);
const emptyForm = { kegiatanId: '', namaKegiatan: '', tahunPeriode: 2026, instrumentId: '' };
const [form, setForm] = useState(emptyForm);
const notify = (message, type = 'success') => {
 setToast({ show: true, message, type });
 setTimeout(() => setToast({ show: false, message: '', type: 'success' }), 5000);
};
const applyBundle = (b) => {
 setInstruments(b.instruments || []); setCriteria(b.criteria || []);
 setIndicators(b.indicators || []); setActivities(b.activities || []);
 lsSet(LS_KEYS.INST, b.instruments || []); lsSet(LS_KEYS.CRIT, b.criteria || []);
 lsSet(LS_KEYS.IND, b.indicators || []); lsSet(LS_KEYS.ACT, b.activities || []);
};
const loadLocal = () => applyBundle({
 instruments: lsGet(LS_KEYS.INST, []), criteria: lsGet(LS_KEYS.CRIT, []),
 indicators : lsGet(LS_KEYS.IND, []), activities: lsGet(LS_KEYS.ACT, [])
});
const refreshActivityBundle = (done) => {
 const ok = gasRun('getInstrumentBundle', [], (res) => {
   if (res && res.success && res.data) { applyBundle(res.data); if (done) done(true); }
   else if (done) done(false, res?.error || 'Gagal membaca data kegiatan audit.');
 }, (err) => { if (done) done(false, err?.message || 'Kesalahan server.'); });
 if (!ok && done) done(false, 'Koneksi Google Apps Script tidak tersedia.');
};
useEffect(() => {
 setLoading(true);
 const ok = gasRun('getInstrumentBundle', [],
   (res) => { (res && res.success && res.data) ? applyBundle(res.data) : loadLocal(); setLoading(false); },
   () => { loadLocal(); setLoading(false); });
 if (!ok) { loadLocal(); setLoading(false); }
}, []);
useEffect(() => { if (window.lucide) window.lucide.createIcons(); },
 [activities, instruments, form, toast, confirm, loading]);
const previewValidation = useMemo(
 () => validateInstrument(form.instrumentId, criteria, indicators),
 [form.instrumentId, criteria, indicators]);
const persistActivities = (next) => { setActivities(next); lsSet(LS_KEYS.ACT, next); };
const saveKegiatan = (e) => {
 e.preventDefault();
 if (!isSuperAdmin) return notify('Hanya Super Admin yang dapat membuat kegiatan audit.', 'error');
 const nama = String(form.namaKegiatan || '').trim();
 if (!nama) return notify('Nama kegiatan audit wajib diisi!', 'error');
 const tahun = Number(form.tahunPeriode);
 if (!(tahun >= 2026 && tahun <= 2046)) return notify('Tahun periode wajib dipilih (2026–2046).', 'error');
 if (!form.instrumentId) return notify('Pilih instrumen audit terlebih dahulu.', 'error');
 const inst = instruments.find(i => i.instrumentId === form.instrumentId);
 if (!inst) return notify('Instrumen yang dipilih belum tersedia di server. Simpan instrumen terlebih dahulu.', 'error');
 const prev = activities.find(a => a.kegiatanId === form.kegiatanId);
 const obj = {
   kegiatanId: form.kegiatanId || uid('KEG'), namaKegiatan: nama,
   tahunPeriode: String(tahun), instrumentId: form.instrumentId,
   namaInstrumen: inst.namaInstrumen,
   status: prev && prev.status === 'AKTIF' ? 'AKTIF' : 'DRAFT',
   createdBy: prev ? prev.createdBy : (currentUser?.nama || ''),
   createdAt: prev ? prev.createdAt : new Date().toISOString(),
   activatedAt: prev ? prev.activatedAt : ''
 };
 gasRun('saveAuditActivityServer', [obj, currentUser?.role, currentUser?.userId], (r) => {
   if (!r || !r.success) { notify(r?.message || 'Kegiatan audit gagal disimpan.', 'error'); refreshActivityBundle(); return; }
   refreshActivityBundle((ok, err) => {
     if (!ok) { notify('Kegiatan tersimpan, tetapi daftar gagal dimuat: ' + err, 'error'); return; }
     setForm(emptyForm); notify(r.message || 'Kegiatan audit tersimpan sebagai DRAFT.');
   });
 }, (err) => { notify('Gagal menyimpan kegiatan: ' + (err?.message || 'Kesalahan server.'), 'error'); refreshActivityBundle(); });
};
/** Aktivasi dilakukan di server; UI hanya berubah setelah transaksi berhasil. */
const activate = (a) => {
 if (!isSuperAdmin) return notify('Hanya Super Admin yang dapat mengaktivasi instrumen.', 'error');
 if (!a.instrumentId) return notify('Kegiatan ini belum memilih instrumen audit.', 'error');
 const v = validateInstrument(a.instrumentId, criteria, indicators);
 if (!v.valid) return notify('AKTIVASI DITOLAK:\n• ' + v.errors.join('\n• '), 'error');
 gasRun('activateAuditActivityServer', [a.kegiatanId, currentUser?.role, currentUser?.userId], (r) => {
   if (!r || !r.success) { notify(r?.message || 'Aktivasi kegiatan audit gagal.', 'error'); refreshActivityBundle(); return; }
   refreshActivityBundle(() => notify(r.message || `Kegiatan ${a.namaKegiatan} berhasil diaktivasi.`));
 }, (err) => { notify('Gagal menghubungi server saat aktivasi: ' + (err?.message || 'Kesalahan server.'), 'error'); refreshActivityBundle(); });
};

const deactivate = (a) => {
 if (!isSuperAdmin) return;
  persistActivities(activities.map(x => x.kegiatanId === a.kegiatanId ? { ...x, status: 'DRAFT' } : x));
 setInstruments(prev => {
   const next = prev.map(i => i.instrumentId === a.instrumentId ? { ...i, status: 'NONAKTIF' } : i);
   lsSet(LS_KEYS.INST, next); return next;
  });
 gasRun('deactivateAuditActivityServer', [a.kegiatanId, currentUser?.role]);
  notify('Kegiatan dinonaktifkan.');
};

function AuditorAuditWorkspacePage({ user }){

function MainApp() {
      const [currentUser, setCurrentUser] = useState(getCurrentUser());
      const [activeTab, setActiveTab] = useState('dashboard');
      const handleLoginSuccess = (user) => {
       setCurrentUser(user);
       setActiveTab('dashboard');
       // Catat login semua role ke Audit Trail; kegagalan log tidak mengganggu login.
       if (typeof google !== 'undefined' && google.script && google.script.run && user) {
         google.script.run.withFailureHandler(function(){}).recordUserLoginServer(user.userId, user.role);
       }
      };
      const handleLogout = () => {
       clearCurrentUser();
       setCurrentUser(null);
      };
      if (!currentUser) {
        return <LoginPage onLoginSuccess={handleLoginSuccess} />;
      }
const renderContent = () => {
 const navigate = (tab) => setActiveTab(tab);
    // Auditee: gunakan halaman khusus
    if (currentUser?.role === ROLES.AUDITEE) {
      switch (activeTab) {
        case 'dashboard': return <AuditeeDashboardPage user={currentUser} onNavigate={navigate} />;
        case 'asesmen': return <AuditeeSelfAssessmentPage user={currentUser} />;
        case 'jadwal-saya': return <AuditeeSchedulePage user={currentUser} />;
        case 'hasil-audit': return <AuditeeResultsPage user={currentUser} />;
        case 'rtl': return <AuditeeRTLPage user={currentUser} />;
        case 'matriks-risiko': return <MatriksPrioritasRisikoPage user={currentUser} />;
        case 'matriks-rtl': return <MatriksRTLPage user={currentUser} />;
        case 'berita-acara': return <AuditeeBeritaAcaraPage user={currentUser} />;
        case 'laporan': return <AuditeeLaporanPage user={currentUser} />;
        default: return <AuditeeDashboardPage user={currentUser} onNavigate={navigate} />;
      }
    }
    // Auditor: gunakan halaman khusus
    if (currentUser?.role === ROLES.AUDITOR) {
      switch (activeTab) {
        case 'dashboard': return <AuditorDashboardPage user={currentUser} onNavigate={navigate} />;
        case 'penugasan': return <PenugasanSayaPage user={currentUser} onNavigate={navigate} />;
        case 'audit': return <AuditorAuditWorkspacePage user={currentUser} />;
        case 'temuan': return <AuditorTemuanPage user={currentUser} />;
        case 'analisis-risiko': return <AnalisisRisikoTemuanPage user={currentUser} />;
        case 'matriks-risiko': return <MatriksPrioritasRisikoPage user={currentUser} />;
        case 'matriks-rtl': return <MatriksRTLPage user={currentUser} />;
        case 'berita-acara': return <AuditorBeritaAcaraPage user={currentUser} />;
        case 'laporan': return <AuditorLaporanPage user={currentUser} />;
        default: return <AuditorDashboardPage user={currentUser} onNavigate={navigate} />;
      }
    }
 // Role lain: pakai existing (tidak saya ubah strukturnya)
 switch (activeTab) {
    case 'dashboard': return <DashboardPage user={currentUser} />;
    case 'asesmen': return <AsesmenPage />;
    case 'audit': return <AuditWorkspacePage />;
    case 'laporan': return <AdminLaporanPage user={currentUser} />;
    case 'rtl': return <RTLPage />;
    case 'users': return <UsersPage currentUser={currentUser} />;

      return (
